[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-assistant"
version = "0.1.0"
description = "Fundamentos modulares y contratos de Atlas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "argon2-cffi>=23.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
atlas = "atlas.cli:main"
