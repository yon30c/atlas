name: Atlas CI

on:
  push:
    branches:
      - "implementation/**"
  pull_request:
    branches:
      - main
      - "implementation/**"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify SQLite runtime compatibility
        run: |
          python - <<'PY'
          import sqlite3
          minimum = (3, 26, 0)
          current = sqlite3.sqlite_version_info
          print(f"SQLite runtime: {sqlite3.sqlite_version}")
          if current < minimum:
              raise SystemExit(
                  f"SQLite >= {'.'.join(map(str, minimum))} is required; found {sqlite3.sqlite_version}"
              )
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
